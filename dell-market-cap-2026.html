<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>O valor da Dell nos últimos 5 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#D9001E;--black:#111;--g2:#666;--g3:#aaa;
  --line:#EBEBEB;--white:#fff;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Archivo',sans-serif;
  --blk:'Archivo Black',sans-serif;
}
html,body{width:100%;background:var(--white);color:var(--black);font-family:var(--sans);-webkit-font-smoothing:antialiased;margin:0}
.wrap{container-type:inline-size;width:100%}
.hdr{padding:20px 24px 16px;border-top:3px solid var(--red);border-bottom:1px solid var(--line)}
.hdr h1{font-family:var(--blk);font-size:clamp(16px,4cqi,22px);line-height:1.1;margin-bottom:6px}
.hdr h1 em{font-style:normal;color:var(--red)}
.hdr p{font-size:clamp(11px,2.2cqi,13px);color:var(--g2);line-height:1.5}
.chart-wrap{padding:16px 24px 4px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.foot{padding:10px 24px 14px}
.foot-src{font-size:clamp(9px,1.8cqi,11px);color:var(--g3)}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <h1>O valor da <em>Dell</em> nos últimos 5 anos</h1>
    <p>Ações da empresa têm aproveitado do avanço da IA</p>
  </div>

  <div class="chart-wrap">
    <svg class="chart-svg" viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg">

      <!-- grid lines horizontais -->
      <line x1="30" y1="80"  x2="590" y2="80"  stroke="#EBEBEB" stroke-width="1"/>
      <line x1="30" y1="130" x2="590" y2="130" stroke="#EBEBEB" stroke-width="1"/>
      <line x1="30" y1="180" x2="590" y2="180" stroke="#EBEBEB" stroke-width="1"/>
      <!-- baseline -->
      <line x1="30" y1="220" x2="590" y2="220" stroke="#EBEBEB" stroke-width="1.5"/>

      <!-- area gradiente -->
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#D9001E" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#D9001E" stop-opacity="0.01"/>
        </linearGradient>
      </defs>
      <polygon
        points="30,220 30,188.3 142,182.0 254,163.0 366,147.1 478,124.9 590,40 590,220"
        fill="url(#grad)"
      />

      <!-- linha -->
      <polyline
        points="30,188.3 142,182.0 254,163.0 366,147.1 478,124.9 590,40"
        fill="none"
        stroke="#D9001E"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- valores acima de cada ponto -->
      <text x="30"  y="178" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#999">50 bi</text>
      <text x="142" y="172" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#999">60 bi</text>
      <text x="254" y="153" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#999">90 bi</text>
      <text x="366" y="137" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#666">115 bi</text>
      <text x="478" y="115" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#666">150 bi</text>
      <text x="590" y="30"  text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600" fill="#D9001E">284 bi</text>

      <!-- bolinhas intermediárias -->
      <circle cx="30"  cy="188.3" r="4" fill="white" stroke="#D9001E" stroke-width="2"/>
      <circle cx="142" cy="182.0" r="4" fill="white" stroke="#D9001E" stroke-width="2"/>
      <circle cx="254" cy="163.0" r="4" fill="white" stroke="#D9001E" stroke-width="2"/>
      <circle cx="366" cy="147.1" r="4" fill="white" stroke="#D9001E" stroke-width="2"/>
      <circle cx="478" cy="124.9" r="4" fill="white" stroke="#D9001E" stroke-width="2"/>
      <!-- último ponto destaque -->
      <circle cx="590" cy="40"    r="6" fill="#D9001E" stroke="white" stroke-width="2.5"/>

      <!-- labels dos anos -->
      <text x="30"  y="238" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#aaa">2021</text>
      <text x="142" y="238" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#aaa">2022</text>
      <text x="254" y="238" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#aaa">2023</text>
      <text x="366" y="238" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#aaa">2024</text>
      <text x="478" y="238" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#aaa">2025</text>
      <text x="590" y="238" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#D9001E">mai/26</text>

    </svg>
  </div>

  <div class="foot">
    <span class="foot-src">Fonte: Bloomberg, CompaniesMarketCap · Valores aproximados em bilhões de dólares · mai/26 = maio de 2026</span>
  </div>

</div>
<script>
  function h(){window.parent.postMessage({height:document.body.scrollHeight},'*');}
  window.addEventListener('load',h);
  window.addEventListener('resize',h);
</script>
</body>
</html>
