<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>O valor de mercado da Amazon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#D9001E;--black:#111;--g1:#333;--g2:#666;--g3:#aaa;
  --gbg:#F7F7F7;--line:#EBEBEB;--white:#fff;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Archivo',sans-serif;
  --blk:'Archivo Black',sans-serif;
}
body{background:var(--white);color:var(--black);font-family:var(--sans);width:800px;margin:0 auto;-webkit-font-smoothing:antialiased}

.hdr{padding:28px 48px 24px;border-top:3px solid var(--red);border-bottom:1px solid var(--line)}
.hdr h1{font-family:var(--blk);font-size:26px;line-height:1.1;color:var(--black);margin-bottom:8px;letter-spacing:-0.3px}
.hdr h1 em{font-style:normal;color:var(--red)}
.hdr-sub{display:flex;align-items:baseline;gap:8px}
.hdr-sub p{font-size:13px;color:var(--g2);line-height:1.5}
.hdr-sub span{font-family:var(--mono);font-size:10px;color:var(--g3);white-space:nowrap}

.chart{padding:28px 48px 32px}

.bars{display:flex;align-items:flex-end;gap:14px;height:210px;border-bottom:1px solid var(--line);margin-bottom:0;padding-bottom:0}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0}
.blbl{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--g2);margin-bottom:5px;white-space:nowrap;text-align:center}
.blbl.cur{color:var(--red);font-size:10.5px}
.bfill{width:100%;border-radius:2px 2px 0 0;transform-origin:bottom;transform:scaleY(0);animation:growV .6s cubic-bezier(.4,0,.2,1) forwards}
.byr{font-family:var(--mono);font-size:9px;color:var(--g3);margin-top:8px;letter-spacing:.3px}
.byr.cur{color:var(--red);font-weight:600}

.foot{padding:14px 48px;border-top:1px solid var(--line)}
.foot-src{font-size:11px;color:var(--g3)}

@keyframes growV{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
</head>
<body>
<div class="hdr">
  <h1>O valor de mercado da <em>Amazon</em></h1>
  <div class="hdr-sub">
    <p>Valor consolidado da empresa ano a ano</p>
    <span>(em bilhões de dólares)</span>
  </div>
</div>
<div class="chart">
  <div class="bars">
    <div class="bcol">
      <div class="blbl">1,6 tri</div>
      <div class="bfill" style="height:101px;background:rgba(217,0,30,0.12);animation-delay:0.00s"></div>
      <div class="byr">2020</div>
    </div>
    <div class="bcol">
      <div class="blbl">1,7 tri</div>
      <div class="bfill" style="height:105px;background:rgba(217,0,30,0.20);animation-delay:0.08s"></div>
      <div class="byr">2021</div>
    </div>
    <div class="bcol">
      <div class="blbl">857 bi</div>
      <div class="bfill" style="height:53px;background:rgba(217,0,30,0.15);animation-delay:0.16s"></div>
      <div class="byr">2022</div>
    </div>
    <div class="bcol">
      <div class="blbl">1,6 tri</div>
      <div class="bfill" style="height:97px;background:rgba(217,0,30,0.32);animation-delay:0.24s"></div>
      <div class="byr">2023</div>
    </div>
    <div class="bcol">
      <div class="blbl">2,4 tri</div>
      <div class="bfill" style="height:146px;background:rgba(217,0,30,0.55);animation-delay:0.32s"></div>
      <div class="byr">2024</div>
    </div>
    <div class="bcol">
      <div class="blbl">2,5 tri</div>
      <div class="bfill" style="height:154px;background:rgba(217,0,30,0.75);animation-delay:0.40s"></div>
      <div class="byr">2025</div>
    </div>
    <div class="bcol">
      <div class="blbl cur">2,6 tri</div>
      <div class="bfill" style="height:160px;background:#D9001E;animation-delay:0.48s"></div>
      <div class="byr cur">mai/26</div>
    </div>
  </div>
</div>
<div class="foot">
  <span class="foot-src">Fonte: CompaniesMarketCap, Bloomberg · Dados anuais de fechamento · mai/26 = maio de 2026</span>
</div>
<script>
  function h(){window.parent.postMessage({height:document.body.scrollHeight},'*');}
  window.addEventListener('load',h);
  window.addEventListener('resize',h);
</script>
</body>
</html>
