<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Índice ExameLab · Eleições 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D9001E; --ink:#14110F; --graphite:#3A3A3A;
    --paper:#FBFAF8; --hair:#E6E1DA; --muted:#8A837B; --muted2:#B7B0A8;
    --disp:"Archivo Black",system-ui,sans-serif;
    --body:"Archivo",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.4}
  .wrap{container-type:inline-size;max-width:900px;margin:0 auto}
  .board{border:1px solid var(--hair);background:#fff}
  .eyebrow{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px}
  .eyebrow .dot{width:8px;height:8px;background:var(--red);border-radius:50%}
  .eyebrow .spacer{flex:1}
  .eyebrow .live{color:var(--muted2)}
  .head{padding:22px 18px 0}
  h1{font-family:var(--disp);font-size:clamp(26px,7cqi,40px);line-height:.98;margin:0 0 16px;letter-spacing:-.01em}

  /* abas */
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--ink)}
  .tab{appearance:none;background:none;border:none;cursor:pointer;padding:10px 14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
  .tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
  .panel{display:none}
  .panel.active{display:block}

  .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:6px 16px;padding:14px 18px 0}
  .meta b{color:var(--ink);font-weight:600}
  .sec{padding:6px 18px 20px}
  .sec + .sec{border-top:1px solid var(--hair)}
  .sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:18px 0 12px;font-weight:600}

  .h2h-bar{display:flex;height:44px;border:1px solid var(--hair);position:relative;overflow:hidden;margin-top:16px}
  .h2h-seg{display:flex;align-items:center;color:#fff;font-family:var(--disp);font-size:15px;padding:0 12px;white-space:nowrap}
  .h2h-seg.l{background:var(--red);justify-content:flex-start}
  .h2h-seg.r{background:var(--graphite);justify-content:flex-end}
  .h2h-50{position:absolute;top:-4px;bottom:-4px;left:50%;width:2px;background:var(--ink);transform:translateX(-1px)}
  .h2h-50 span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:9.5px;color:var(--ink);background:var(--paper);padding:0 4px;letter-spacing:.05em}
  .h2h-cap{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:8px}

  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
  .row.ranked{grid-template-columns:22px 1fr auto}
  .rk{font-family:var(--mono);font-size:12px;color:var(--muted2);text-align:right}
  .nm{font-family:var(--disp);font-size:16px;letter-spacing:-.01em}
  .nm .party{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
  .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px}
  .sub .prob{color:var(--ink)}
  .barwrap{margin-top:7px;height:8px;background:var(--paper);position:relative;border:1px solid var(--hair)}
  .bar{position:absolute;top:-1px;bottom:-1px;background:var(--muted2)}
  .row.lead .bar{background:var(--red)}
  .row.two .bar{background:var(--graphite)}
  .icseg{position:absolute;top:50%;height:1px;background:var(--ink);opacity:.35}
  .pct{font-family:var(--disp);font-size:22px;letter-spacing:-.02em;text-align:right;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;min-width:74px}
  .pct .u{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
  .trend{font-family:var(--mono);font-size:11px;margin-left:6px}
  .up{color:var(--red)} .down{color:var(--graphite)} .flat{color:var(--muted2)}
  .swatch{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:middle}

  .chart{width:100%;height:auto;display:block;border:1px solid var(--hair);background:#fff}
  .chart-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:8px}

  .poll{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--hair)}
  .poll:first-child{border-top:none}
  .poll .inst{font-family:var(--disp);font-size:14px}
  .poll .psub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
  .poll .detalhe{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
  .poll .detalhe .a{color:var(--red)} .poll .detalhe .b{color:var(--graphite)}
  .poll .amostra{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;margin-top:3px}
  .uf{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--ink);color:#fff;padding:2px 7px;margin-right:8px;vertical-align:middle}

  .waiting{border:1px dashed var(--hair);padding:26px 18px;text-align:center;margin-top:16px}
  .waiting .wt{font-family:var(--disp);font-size:15px;margin-bottom:6px}
  .waiting .ws{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.6}

  .foot{padding:16px 18px 20px;border-top:2px solid var(--ink);background:var(--paper)}
  .foot p{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0 0 6px;line-height:1.5}
  .foot a{color:var(--red);text-decoration:none}
  .foot a:hover{text-decoration:underline}

  @container (max-width:560px){
    h1{font-size:30px}
    .tab{padding:9px 10px;font-size:10px}
    .pct{font-size:19px;min-width:62px}
    .nm{font-size:15px}
    .h2h-seg{font-size:13px}
    .poll{grid-template-columns:1fr}
    .poll .detalhe,.poll .amostra{text-align:left}
  }
  @media (prefers-reduced-motion:no-preference){
    .h2h-seg{transition:width .7s cubic-bezier(.2,.7,.2,1)}
    .bar{transition:width .6s cubic-bezier(.2,.7,.2,1)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div class="eyebrow">
      <span class="dot"></span><span>Índice ExameLab · Eleições 2026</span>
      <span class="spacer"></span><span class="live" id="live"></span>
    </div>
    <div class="head">
      <h1>Agregador de<br>pesquisas</h1>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-panel="presidente">Presidente</button>
        <button class="tab" role="tab" aria-selected="false" data-panel="aprovacao">Aprovação</button>
        <button class="tab" role="tab" aria-selected="false" data-panel="governadores">Governadores</button>
      </div>
    </div>

    <section class="panel active" id="panel-presidente"></section>
    <section class="panel" id="panel-aprovacao"></section>
    <section class="panel" id="panel-governadores"></section>

    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
/* Página em abas. Cada aba lê seu JSON de ./dados/; se faltar, mostra estado
   de espera honesto. Quem define os formatos é scripts/coleta.mjs. */
const SEED_PRES = {
  "atualizado_em":"2026-07-31","corte":"2026-07-27","cenario":"2º turno · Lula × Flávio",
  "metodologia":"Filtro de Kalman sobre pesquisas registradas","ultima_pesquisa":"AtlasIntel (27/07/2026)","indecisos":null,
  "prob_vitoria":{"Lula":100,"Flávio Bolsonaro":0},
  "fonte":"Agregador 2026 (Filtro de Kalman) — Joaquim Bermudes, a partir de pesquisas registradas no TSE",
  "fonte_url":"https://joaquimbermudes.github.io/Agregador_2026/",
  "candidatos":[
    {"nome":"Lula","partido":"PT","media":52.3,"ic_min":51.1,"ic_max":53.5,"tendencia_14d":0},
    {"nome":"Flávio Bolsonaro","partido":"PL","media":47.7,"ic_min":46.5,"ic_max":48.9,"tendencia_14d":0}],
  "ultimas_pesquisas":[
    {"instituto":"PoderData","coleta_label":"26 Jul - 28 Jul","amostra":2400,"detalhe":"Lula 46% × Flávio 43%"},
    {"instituto":"AtlasIntel","coleta_label":"22 Jul - 27 Jul","amostra":5021,"detalhe":"Lula 49,2% × Flávio 42,9%"},
    {"instituto":"Nexus/BTG","coleta_label":"24 Jul - 26 Jul","amostra":2004,"detalhe":"Lula 47% × Flávio 43%"},
    {"instituto":"Datafolha","coleta_label":"22 Jul - 24 Jul","amostra":2004,"detalhe":"Lula 48% × Flávio 43%"}]
};
const SEED_HIST = { "pontos":[{"data":"2026-07-27","cenario":"2º turno · Lula × Flávio","valores":{"Lula":52.3,"Flávio Bolsonaro":47.7}}] };

async function carregar(url, seed){
  try{ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ return seed; }
}
const nf = n => Number(n).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const ddmmyy = iso => { const [y,m,d]=String(iso).split("-"); return `${d}/${m}/${y.slice(2)}`; };
const ddmm = iso => { const [y,m,d]=String(iso).split("-"); return `${d}/${m}`; };
const trendMark = t => t>0.3?`<span class="trend up">▲ ${nf(t)}</span>`:t<-0.3?`<span class="trend down">▼ ${nf(-t)}</span>`:'<span class="trend flat">▬</span>';
const pn = n => n.split(" ")[0];
const COLORS=["var(--red)","var(--graphite)"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function svgLinhas(pts, series, opts){
  const W=860,H=260,pad={t:18,r:70,b:34,l:34};
  const {yMin,yMax,step,linha50}=opts;
  const x=(i,n)=> pad.l+(n<=1?0:(i/(n-1)))*(W-pad.l-pad.r);
  const y=v=> pad.t+(1-(v-yMin)/(yMax-yMin))*(H-pad.t-pad.b);
  let grid="";
  for(let v=yMin;v<=yMax;v+=step){
    const e=linha50&&v===50;
    grid+=`<line x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}" stroke="${e?'var(--ink)':'var(--hair)'}" stroke-width="1" ${e?'stroke-dasharray="2 3"':''}/>`+
          `<text x="${pad.l-6}" y="${y(v)+3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="var(--muted)">${v}</text>`;
  }
  let b="";
  if(pts.length>=2){
    series.forEach(s=>{
      const valid=pts.filter(p=>p.valores[s.name]!=null);
      if(valid.length<2) return;
      const d=valid.map((p,i)=>`${i?"L":"M"}${x(pts.indexOf(p),pts.length).toFixed(1)},${y(p.valores[s.name]).toFixed(1)}`).join(" ");
      const last=valid[valid.length-1];
      b+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`+
         `<circle cx="${x(pts.indexOf(last),pts.length).toFixed(1)}" cy="${y(last.valores[s.name]).toFixed(1)}" r="3.5" fill="${s.color}"/>`+
         `<text x="${(x(pts.indexOf(last),pts.length)+8).toFixed(1)}" y="${(y(last.valores[s.name])+3).toFixed(1)}" font-family="var(--mono)" font-size="11" font-weight="600" fill="${s.color}">${nf(last.valores[s.name])}</text>`;
    });
    pts.forEach((p,i)=>{ if(i%Math.ceil(pts.length/6||1)===0||i===pts.length-1)
      b+=`<text x="${x(i,pts.length).toFixed(1)}" y="${H-pad.b+16}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${ddmm(p.data)}</text>`; });
  } else if(pts.length===1){
    const p=pts[0];
    series.forEach(s=>{ if(p.valores[s.name]==null) return; const px=W-pad.r,py=y(p.valores[s.name]);
      b+=`<circle cx="${px}" cy="${py.toFixed(1)}" r="4" fill="${s.color}"/>`+
         `<text x="${px-8}" y="${(py+3).toFixed(1)}" text-anchor="end" font-family="var(--mono)" font-size="11" font-weight="600" fill="${s.color}">${nf(p.valores[s.name])}</text>`; });
    b+=`<text x="${(pad.l+(W-pad.r))/2}" y="${H/2-4}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--muted)">Série em formação — 1 ponto</text>`+
       `<text x="${(pad.l+(W-pad.r))/2}" y="${H/2+14}" text-anchor="middle" font-family="var(--mono)" font-size="10.5" fill="var(--muted2)">a linha aparece a partir do 2º ponto de coleta</text>`;
  } else {
    b+=`<text x="${(pad.l+(W-pad.r))/2}" y="${H/2}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--muted)">Aguardando a primeira coleta</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${grid}${b}</svg>`;
}

function waiting(titulo, msg){
  return `<div class="sec"><div class="waiting"><div class="wt">${titulo}</div><div class="ws">${msg}</div></div></div>`;
}

/* ---- ABA PRESIDENTE ---- */
function renderPresidente(el, ag, hist){
  const runoff = ag.candidatos.length===2;
  const metas=[
    `<span><b>Cenário</b> ${ag.cenario}</span>`,`<span><b>Método</b> ${ag.metodologia}</span>`,
    ag.ultima_pesquisa?`<span><b>Última pesquisa</b> ${ag.ultima_pesquisa}</span>`:"",
    ag.indecisos!=null?`<span><b>Indecisos</b> ${nf(ag.indecisos)}%</span>`:"",
    `<span><b>Corte</b> ${ddmmyy(ag.corte)}</span>`].filter(Boolean).join("");
  let board="";
  if(runoff){
    const [a,b]=ag.candidatos,total=a.media+b.media;
    board+=`<div class="h2h-bar">
      <div class="h2h-seg l" style="width:${(a.media/total*100).toFixed(1)}%">${a.nome} ${nf(a.media)}%</div>
      <div class="h2h-seg r" style="width:${(b.media/total*100).toFixed(1)}%">${nf(b.media)}% ${pn(b.nome)}</div>
      <div class="h2h-50"><span>50%</span></div></div>`;
    if(ag.prob_vitoria) board+=`<div class="h2h-cap">Linha dos 50% = maioria no 2º turno. Chance de vitória (sim.): ${a.nome} ${nf(ag.prob_vitoria[a.nome])}% · ${pn(b.nome)} ${nf(ag.prob_vitoria[b.nome])}%.</div>`;
    board+=ag.candidatos.map((c,i)=>`<div class="row">
      <div><div class="nm"><span class="swatch" style="background:${COLORS[i]}"></span>${c.nome}<span class="party">${c.partido}</span></div>
      <div class="sub">IC 95%: ${nf(c.ic_min)}–${nf(c.ic_max)}%${ag.prob_vitoria?` · <span class="prob">vitória (sim.) ${nf(ag.prob_vitoria[c.nome])}%</span>`:""}</div></div>
      <div class="pct">${nf(c.media)}<span class="u">%</span>${trendMark(c.tendencia_14d)}</div></div>`).join("");
  } else {
    const max=Math.max(...ag.candidatos.map(c=>c.ic_max||c.media)),scale=100/max;
    board+=ag.candidatos.map((c,i)=>{
      const cls=i===0?"lead":i===1?"two":"";
      return `<div class="row ranked ${cls}">
        <div class="rk">${String(i+1).padStart(2,"0")}</div>
        <div><div class="nm">${c.nome}${c.partido?`<span class="party">${c.partido}</span>`:""}</div>
        <div class="barwrap"><div class="icseg" style="left:${(c.ic_min*scale).toFixed(1)}%;width:${((c.ic_max-c.ic_min)*scale).toFixed(1)}%"></div>
        <div class="bar" style="width:${(c.media*scale).toFixed(1)}%"></div></div>
        <div class="sub">IC 95%: ${nf(c.ic_min)}–${nf(c.ic_max)}%</div></div>
        <div><div class="pct">${nf(c.media)}<span class="u">%</span>${trendMark(c.tendencia_14d)}</div></div></div>`;
    }).join("");
  }
  const pts=(hist.pontos||[]).filter(p=>!p.cenario||p.cenario===ag.cenario);
  const series=ag.candidatos.slice(0,2).map((c,i)=>({name:c.nome,color:COLORS[i]}));
  const chart=svgLinhas(pts,series,{yMin:runoff?40:20,yMax:runoff?60:50,step:runoff?5:10,linha50:runoff});
  const legenda = pts.length>=2 ? `Série própria (ExameLab), 1 ponto por atualização — top 2 do cenário. ${series.map(s=>`<span style="color:${s.color}">■</span> ${pn(s.name)}`).join(" &nbsp; ")}` :
    pts.length===1 ? `A tendência se monta com os snapshots do coletor — há só o retrato de ${ddmmyy(pts[0].data)}.` : "";
  const polls=(ag.ultimas_pesquisas||[]).map(p=>`<div class="poll">
    <div><div class="inst">${p.instituto}</div><div class="psub">Coleta ${p.coleta_label||""}</div></div>
    <div>${p.detalhe?`<div class="detalhe">${p.detalhe}</div>`:""}<div class="amostra">amostra ${Number(p.amostra||0).toLocaleString("pt-BR")}</div></div></div>`).join("");
  el.innerHTML = `<div class="meta">${metas}</div>
    <div class="sec"><div class="sec-h">${ag.cenario}</div>${board}</div>
    <div class="sec"><div class="sec-h">Tendência</div>${chart}<div class="chart-note">${legenda}</div></div>
    ${polls?`<div class="sec"><div class="sec-h">Últimas pesquisas</div>${polls}</div>`:""}`;
}

/* ---- ABA APROVAÇÃO ---- */
function renderAprovacao(el, ap, hist){
  if(!ap){ el.innerHTML = waiting("Aprovação do governo — em coleta",
    "O robô diário ainda não conseguiu extrair as fichas de aprovação da fonte.<br>Ele tenta de novo a cada rodada; nada a fazer do seu lado."); return; }
  const total=ap.aprova_media+ap.desaprova_media;
  const bar=`<div class="h2h-bar">
    <div class="h2h-seg l" style="width:${(ap.aprova_media/total*100).toFixed(1)}%">Aprova ${nf(ap.aprova_media)}%</div>
    <div class="h2h-seg r" style="width:${(ap.desaprova_media/total*100).toFixed(1)}%">${nf(ap.desaprova_media)}% Desaprova</div>
    <div class="h2h-50"><span>50%</span></div></div>
    <div class="h2h-cap">${ap.metodologia}.</div>`;
  const pts=(hist.pontos||[]).filter(p=>p.cenario==="Aprovação do governo");
  const chart=svgLinhas(pts,[{name:"Aprova",color:COLORS[0]},{name:"Desaprova",color:COLORS[1]}],{yMin:30,yMax:70,step:10,linha50:true});
  const itens=(ap.itens||[]).map(p=>`<div class="poll">
    <div><div class="inst">${esc(p.instituto)}</div><div class="psub">Coleta ${p.coleta||""}</div></div>
    <div><div class="detalhe"><span class="a">Aprova ${nf(p.aprova)}%</span> × <span class="b">Desaprova ${nf(p.desaprova)}%</span></div>
    <div class="amostra">amostra ${Number(p.amostra||0).toLocaleString("pt-BR")}</div></div></div>`).join("");
  el.innerHTML = `<div class="meta"><span><b>Recorte</b> ${ap.titulo}</span><span><b>Atualizado</b> ${ddmmyy(ap.atualizado_em)}</span></div>
    <div class="sec"><div class="sec-h">${ap.titulo}</div>${bar}</div>
    <div class="sec"><div class="sec-h">Tendência</div>${chart}<div class="chart-note">${pts.length>=2?'<span style="color:var(--red)">■</span> Aprova &nbsp; <span style="color:var(--graphite)">■</span> Desaprova':""}</div></div>
    <div class="sec"><div class="sec-h">Pesquisas no cálculo</div>${itens}</div>`;
}

/* ---- ABA GOVERNADORES ---- */
function renderGovernadores(el, gv){
  if(!gv){ el.innerHTML = waiting("Corridas estaduais — em coleta",
    "O robô diário ainda não encontrou pesquisas estaduais na fonte.<br>Assim que aparecerem registradas, elas entram aqui automaticamente."); return; }
  const itens=(gv.itens||[]).map(p=>`<div class="poll">
    <div><div class="inst"><span class="uf">${esc(p.estado)}</span>${esc(p.instituto)}</div>
    <div class="psub">Coleta ${p.coleta||""}${p.tse?` · TSE ${p.tse}`:""}</div></div>
    <div>${p.detalhe?`<div class="detalhe">${esc(p.detalhe)}</div>`:""}<div class="amostra">amostra ${Number(p.amostra||0).toLocaleString("pt-BR")}</div></div></div>`).join("");
  el.innerHTML = `<div class="meta"><span><b>Recorte</b> ${gv.titulo}</span><span><b>Atualizado</b> ${ddmmyy(gv.atualizado_em)}</span></div>
    <div class="sec"><div class="sec-h">Pesquisas estaduais recentes</div>${itens}
    <div class="chart-note" style="margin-top:12px">${gv.nota||""}</div></div>`;
}

/* ---- abas + boot ---- */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t ? "true":"false"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id==="panel-"+t.dataset.panel));
}));

(async function(){
  const [pres, hist, ap, gv] = await Promise.all([
    carregar("./dados/agregado.json", SEED_PRES),
    carregar("./dados/historico.json", SEED_HIST),
    carregar("./dados/aprovacao.json", null),
    carregar("./dados/governadores.json", null),
  ]);
  document.getElementById("live").textContent = "atualizado " + ddmmyy(pres.atualizado_em);
  renderPresidente(document.getElementById("panel-presidente"), pres, hist);
  renderAprovacao(document.getElementById("panel-aprovacao"), ap, hist);
  renderGovernadores(document.getElementById("panel-governadores"), gv);
  const fontes=[...new Set([pres.fonte+"|"+pres.fonte_url, ap?ap.fonte+"|"+ap.fonte_url:null, gv?gv.fonte+"|"+gv.fonte_url:null].filter(Boolean))]
    .map(s=>{const[f,u]=s.split("|");return `<p>Fonte: ${f}. <a href="${u}" target="_blank" rel="noopener">Ver origem →</a></p>`;}).join("");
  document.getElementById("foot").innerHTML =
    `<p><b style="color:var(--ink)">Como ler:</b> não são pesquisas eleitorais, e sim estimativas matemáticas a partir de pesquisas registradas no TSE. IC 95% = intervalo de confiança; probabilidades simuladas não são previsão.</p>`+
    fontes+`<p>Índice ExameLab · atualização diária automática. Estimativas sujeitas a revisão a cada nova pesquisa.</p>`;
})();
</script>
