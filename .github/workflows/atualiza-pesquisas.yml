name: Atualiza agregador de pesquisas

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia ~08:00 BRT (11:00 UTC)
  workflow_dispatch:        # permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar agregado
        run: node agregador-pesquisas/scripts/coleta.mjs

      - name: Commitar se houver mudança
        run: |
          git config user.name  "examelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agregador-pesquisas/dados
          if git diff --staged --quiet; then
            echo "Sem mudanças no agregado hoje."
          else
            git commit -m "dados: agregado $(date -u +%F)"
            git push
          fi
